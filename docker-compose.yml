# ============================================================
# 合同审批审查系统 - Docker Compose 编排
# 服务器: 4核 4G 内存
# 启动: docker compose up -d
# ============================================================

services:
  # ========================================
  # MySQL 8.0 - 主数据库
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: contract-review-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: contract_review
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=2
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - contract-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ========================================
  # Redis 7 - 缓存 & 分布式锁
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: contract-review-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 128mb
      - --maxmemory-policy allkeys-lru
      - --save 900 1
      - --save 300 10
      - --save 60 10000
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  # ========================================
  # MinIO - S3 兼容对象存储
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: contract-review-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - contract-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M

  # ========================================
  # 后端服务 - FastAPI 应用
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: contract-review-backend:latest
    container_name: contract-review-backend
    restart: unless-stopped
    environment:
      APP_NAME: contract_approval_review_system
      APP_VERSION: 0.1.0
      APP_ENV: production
      APP_DEBUG: "false"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      # 数据库
      DB_HOST: 152.136.255.183
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: contract_review
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      DB_ECHO: "false"
      # Redis
      REDIS_HOST: 152.136.255.183
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_PREFIX: "contract_review:"
      # MinIO
      MINIO_ENDPOINT: 152.136.255.183:9001
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: contract-documents
      MINIO_SECURE: "false"
      # LLM (部署前替换为实际 API Key)
      LLM_PROVIDER: qwen
      LLM_API_KEY: your_llm_api_key_here
      LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_MODEL_NAME: qwen-plus
      LLM_TEMPERATURE: "0.1"
      LLM_MAX_TOKENS: "4096"
      # 日志
      LOG_LEVEL: INFO
      LOG_DIR: ./logs
      LOG_FORMAT: json
      LOG_ROTATION: 10 MB
      LOG_RETENTION: 30 days
      # 雪花ID
      SNOWFLAKE_WORKER_ID: 1
      SNOWFLAKE_DATACENTER_ID: 1
      # 工作流
      WORKFLOW_MAX_RETRY: 5
      WORKFLOW_RETRY_BASE_DELAY: 60
      WORKFLOW_RETRY_MAX_DELAY: 1800
      WORKFLOW_TASK_TIMEOUT: 600
      # 安全 (部署前务必替换为随机字符串)
      SECRET_KEY: change_me_to_a_random_secret_key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      # MCP
      MCP_SERVER_NAME: contract-review-mcp
      MCP_SERVER_VERSION: 0.1.0
      MCP_TRANSPORT: sse
      # OA
      OA_BASE_URL: http://your-oa-server:8080
      OA_API_KEY: your_oa_api_key_here
      OA_TIMEOUT: 30
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - contract-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 256M

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  backend-logs:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  contract-network:
    driver: bridge