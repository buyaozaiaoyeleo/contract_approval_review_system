[project]
name = "contract-approval-review-system"
version = "0.1.0"
description = "企业级合同审批审查系统"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "dev", email = "dev@example.com" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "mcp>=1.0.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "tenacity>=9.0.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

# B008: FastAPI 的 Depends/Header/Query/Body 在默认参数中是标准模式
# N818: AppException 作为项目基础异常类，不需要 Error 后缀
[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/api/deps.py" = ["B008"]
"app/core/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
